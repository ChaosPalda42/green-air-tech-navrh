; Nastavení PHP, které web Green Air Tech potřebuje.
;
; Zkopírujte tento soubor na server a restartujte Apache:
;
;   sudo cp greenairtech.ini /etc/php/8.5/apache2/conf.d/99-greenairtech.ini
;   sudo systemctl reload apache2
;
; (Když běží PHP přes php-fpm, patří to do /etc/php/8.5/fpm/conf.d/ a
; restartuje se `php8.5-fpm`. Instalátor na stránce install.php ukáže, které
; hodnoty server zrovna má.)
;
; Bez tohohle má Debian výchozí upload_max_filesize 2 MB a fotku z telefonu
; do administrace nenahrajete — server ji odmítne dřív, než se k ní PHP dostane.

upload_max_filesize = 12M
post_max_size = 16M

; Fotka z dnešního telefonu má 24 až 50 megapixelů a knihovna GD jí v paměti
; dá 4 bajty na pixel — tedy 96 až 200 MB — a vedle toho drží zmenšenou kopii.
; S menší pamětí administrace velkou fotku odmítne (a řekne, že ji má zmenšit).
memory_limit = 512M

; Zmenšení velké fotky na serveru chvíli trvá.
max_execution_time = 60

; --- bezpečnost (doporučení php.net, 23. 10. 2026) ---
; session.upload_progress má v PHP čerstvě nalezenou chybu (CVE-2026-115560),
; pro kterou ještě není oprava; web ho nepoužívá, tak ho vypneme.
session.upload_progress.enabled = 0

; Výpis zásobníku u fatální chyby (novinka 8.5) by do logu — a při špatně
; nastaveném serveru i do odpovědi — dal cesty a hodnoty proměnných.
fatal_error_backtraces = 0
