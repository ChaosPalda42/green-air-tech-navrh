; nastavení, které web potřebuje (stejné patří na klientův server)
upload_max_filesize = 12M
post_max_size = 16M
; Fotka z dnešního telefonu má 24 až 50 Mpx a GD jí v paměti dá 4 bajty
; na pixel — 96 až 200 MB, a vedle toho drží zmenšenou kopii. S 256M se
; větší fotka odmítne (413, administrace poradí ji zmenšit); s 512M projde.
memory_limit = 512M
max_execution_time = 60
expose_php = Off
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = On
date.timezone = Europe/Prague

; chyby se logují, nikdy netisknou — jinak tečou do odpovědi se zásobníkem
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
