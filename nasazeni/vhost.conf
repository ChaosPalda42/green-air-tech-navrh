<VirtualHost *:80>
    DocumentRoot /var/www/greenairtech/public

    <Directory /var/www/greenairtech/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # kód, data ani konfigurace nejsou v dokumentovém korenu, takže je přes web nikdo nepřečte
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
